name: Deploy AWS infrastructure

on:
  workflow_dispatch:
    inputs:
      aws-region:
        description: AWS region for the Workbench stack
        required: true
        default: us-east-1
      runtime-secret-name:
        description: Existing Secrets Manager JSON secret for runtime values
        required: true
        default: enterprise-ai-workbench/runtime
      budget-email:
        description: Optional budget alert email
        required: false
        type: string
      ai-provider:
        description: Worker provider (mock keeps the public showcase deterministic)
        required: true
        default: mock
      embedding-provider:
        description: Embedding provider (mock keeps the public showcase deterministic)
        required: true
        default: mock
      vercel-team-slug:
        description: Vercel team slug used by the OIDC trust policy
        required: true
        default: bmccarthy96s-projects
      vercel-project:
        description: Exact Vercel project name used by the OIDC trust policy
        required: true
        default: enterprise-ai-implementation-workbench
      runtime-role:
        description: PostgreSQL role used by the web and worker runtime
        required: true
        default: workbench_runtime

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Synthesize and deploy CDK
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm --prefix infra ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs['aws-region'] }}

      - name: Verify CDK template
        run: npm run infra:synth

      - name: Apply database migrations
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: |
          if [ -z "$DATABASE_ADMIN_URL" ]; then
            echo "DATABASE_ADMIN_URL is required on the production GitHub environment"
            exit 1
          fi
          npm run db:migrate

      - name: Provision runtime role grants and forced RLS
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          RUNTIME_ROLE: ${{ inputs['runtime-role'] }}
        run: |
          psql "$DATABASE_ADMIN_URL" -v runtime_role="$RUNTIME_ROLE" -f scripts/provision-runtime-role.sql

      - name: Verify runtime role and forced RLS
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          RUNTIME_ROLE: ${{ inputs['runtime-role'] }}
        run: |
          psql "$DATABASE_ADMIN_URL" -v runtime_role="$RUNTIME_ROLE" -f scripts/check-runtime-role.sql

      - name: Deploy
        working-directory: infra
        run: |
          npx cdk deploy \
            -c runtimeSecretName="${{ inputs['runtime-secret-name'] }}" \
            -c budgetEmail="${{ inputs['budget-email'] }}" \
            -c aiProvider="${{ inputs['ai-provider'] }}" \
            -c embeddingProvider="${{ inputs['embedding-provider'] }}" \
            -c vercelTeamSlug="${{ inputs['vercel-team-slug'] }}" \
            -c vercelProject="${{ inputs['vercel-project'] }}" \
            --require-approval never
