name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Build/test-time configuration. No real secrets in CI: the AI provider is
  # mocked, AWS clients point at nothing they ever call, and the session
  # secret is CI-only.
  DATABASE_URL: postgres://workbench:workbench@localhost:5432/workbench
  SESSION_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://localhost:4566
  S3_BUCKET: workbench-documents
  JOBS_QUEUE_URL: http://localhost:4566/000000000000/workbench-jobs
  AI_PROVIDER: mock

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-coverage
          path: coverage/
          retention-days: 14
      - run: npm run eval:offline
      - run: npm run eval:check
      - name: Validate proof registry
        run: npm run proof:check
      - name: Upload offline evidence scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-eval-evidence
          path: |
            evals/scoreboard.json
            evals/reports/latest.json
            evals/reports/latest.md
          retention-days: 14
      - run: npm --prefix infra install --no-audit --no-fund
      - run: npm --prefix infra run build
      - run: npm run infra:synth
      - run: npm run build

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: workbench
          POSTGRES_DB: workbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workbench"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      localstack:
        image: localstack/localstack:4.6
        env:
          SERVICES: s3,sqs
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Provision AWS resources (LocalStack)
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          ENDPOINT: http://localhost:4566
        run: |
          aws --endpoint-url=$ENDPOINT s3 mb s3://workbench-documents
          aws --endpoint-url=$ENDPOINT sqs create-queue --queue-name workbench-jobs-dlq
          aws --endpoint-url=$ENDPOINT sqs create-queue --queue-name workbench-jobs
      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:seed
      - name: Start worker for flagship async flow
        env:
          E2E_WORKER: "1"
        run: |
          nohup npm run worker > worker.log 2>&1 &
          echo $! > worker.pid
          for attempt in $(seq 1 30); do
            if grep -q "worker started; polling for jobs" worker.log; then
              break
            fi
            if ! kill -0 "$(cat worker.pid)" 2>/dev/null; then
              cat worker.log
              echo "The worker exited before the async smoke flow started"
              exit 1
            fi
            sleep 1
          done
          grep -q "worker started; polling for jobs" worker.log || {
            cat worker.log
            echo "The worker did not become ready within 30 seconds"
            exit 1
          }
      - name: Run e2e tests
        env:
          E2E_WORKER: "1"
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            worker.log
          retention-days: 7

  proof-bundle:
    name: Publish commit-bound portfolio evidence
    needs: [quality, e2e]
    if: ${{ needs.quality.result == 'success' && needs.e2e.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture verification timestamp
        id: provenance
        run: echo "verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Validate provenance and build proof bundle
        run: |
          npm run proof:check
          npm run proof:bundle
        env:
          PROOF_EVIDENCE_SHA: ${{ github.sha }}
          PROOF_EVIDENCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROOF_EVIDENCE_COMMAND: Required jobs - quality and Playwright e2e
          PROOF_EVIDENCE_VERIFIED_AT: ${{ steps.provenance.outputs.verified_at }}
          PROOF_EVIDENCE_CONCLUSION: success
      - name: Upload portfolio evidence bundle
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-evidence-bundle-${{ github.sha }}
          path: artifacts/proof-bundle/
          retention-days: 30
