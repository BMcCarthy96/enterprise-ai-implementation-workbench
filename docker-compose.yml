services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: workbench-postgres
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench
      POSTGRES_DB: workbench
    ports:
      - "5433:5432"
    volumes:
      - workbench-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d workbench"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    # Pinned to the 4.x community line: the 2026 "latest" images require a
    # LocalStack Pro auth token even for core services.
    image: localstack/localstack:4.6
    container_name: workbench-localstack
    environment:
      SERVICES: s3,sqs
      DEBUG: 0
    ports:
      - "4566:4566"
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"\\(running\\|available\\)\"'"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    profiles: ["enterprise"]
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: workbench-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm.json:/opt/keycloak/data/import/workbench-realm.json:ro

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.133.0
    container_name: workbench-otel
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      # Override these host-side ports when another local stack already owns
      # the conventional OTLP ports (for example, Jaeger on :4318).
      - "${WORKBENCH_OTEL_GRPC_PORT:-4317}:4317"
      - "${WORKBENCH_OTEL_HTTP_PORT:-4318}:4318"
      - "${WORKBENCH_OTEL_PROMETHEUS_PORT:-9464}:9464"
    volumes:
      - ./docker/observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    container_name: workbench-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - workbench-prometheus-data:/prometheus

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.8.2
    container_name: workbench-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4319:4317"
    volumes:
      - ./docker/observability/tempo.yml:/etc/tempo.yaml:ro
      - workbench-tempo-data:/var/tempo

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.0.1
    container_name: workbench-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - workbench-grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo

volumes:
  workbench-pgdata:
  workbench-prometheus-data:
  workbench-tempo-data:
  workbench-grafana-data:
